<!DOCTYPE html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <meta name="theme-color" content="#0b2540" />
    <title>Island D Cochin | Private Island Venue for Weddings &amp; Events in Kochi</title>
    <meta
      name="description"
      content="A private 1.5-acre island on the Kochi backwaters, 15 minutes from Marine Drive. Weddings, parties and corporate events for up to 200 guests, or a Day Out from ₹1,500."
    />
    <link rel="canonical" href="https://islanddcochin.in/" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />

    <!-- where we are, for local search -->
    <meta name="geo.region" content="IN-KL" />
    <meta name="geo.placename" content="Kochi, Kerala" />

    <!-- link previews on WhatsApp, Facebook and the rest -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Island D Cochin" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:url" content="https://islanddcochin.in/" />
    <meta property="og:title" content="Island D Cochin | Private Island Venue for Weddings &amp; Events in Kochi" />
    <meta
      property="og:description"
      content="A private 1.5-acre island on the Kochi backwaters, about 15 minutes from Marine Drive. Weddings, celebrations and corporate events for up to 200 guests, or a Day Out Package from ₹1,500 per person."
    />
    <meta property="og:image" content="https://islanddcochin.in/img/hero.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1920" />
    <meta property="og:image:height" content="1080" />
    <meta property="og:image:alt" content="Aerial view of Island D Cochin surrounded by backwaters" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Island D Cochin | Private Island Venue for Weddings &amp; Events in Kochi" />
    <meta name="twitter:image" content="https://islanddcochin.in/img/hero.jpg" />

    <!-- the hero photo is the largest paint on first load; fetch it alongside the CSS -->
    <link rel="preload" as="image" href="/img/hero.jpg" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Jost:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
